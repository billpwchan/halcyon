<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Halcyon</title>
    <meta name="description" content="An atoll that lives through a day — walk, swim, dive, sail and fly, from sunrise to a bioluminescent night." />
    <meta name="theme-color" content="#04121a" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <meta property="og:title" content="Halcyon" />
    <meta property="og:description" content="A tropical atoll that lives through a day, drawn live in your browser. Walk, swim, sail and fly from sunrise to a bioluminescent night." />
    <meta property="og:image" content="https://halcyon.billpwchan.art/og.jpg" />
    <meta property="og:url" content="https://halcyon.billpwchan.art/" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preload" href="./fonts/InstrumentSerif-normal-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./fonts/InterTight-normal-300_600.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./src/ui/ui.css" />
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="ui" class="ui"></div>
    <section id="intro" class="intro" aria-label="Halcyon">
      <div class="intro-veil"></div>
      <div class="intro-body">
        <p class="intro-kicker"><span>An atoll</span><span class="dot"></span><span>one day long</span></p>
        <h1 class="intro-title" aria-label="Halcyon"><span>H</span><span>a</span><span>l</span><span>c</span><span>y</span><span>o</span><span>n</span></h1>
        <p class="intro-line">Walk the sand. Swim the lagoon. Sail out past the reef where the whales blow,<br />and stay until the sea begins to glow.</p>
        <div class="intro-load"><div class="intro-bar"><i></i></div><span class="intro-stage">Raising the reef</span></div>
        <button class="intro-enter" type="button" disabled><span>Enter the day</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6" /></svg></button>
        <p class="intro-foot">Sound on, if you can &middot; Drag to look &middot; WASD to move</p>
      </div>
    </section>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
